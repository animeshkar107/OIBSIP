<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>

  <body>
    <div class="converter">
      <h1>
        <i class="fa-solid fa-temperature-half"></i>
        Temperature Converter
      </h1>

      <p>Convert temperature here instantly and accurately.</p>

      <div class="input">
        <label for="temp">Enter Temperature</label>
        <input type="number" id="temp" step="any" placeholder="Example: 37" />
      </div>

      <div class="values">
        <label for="unit">Select Unit</label>
        <select id="unit">
          <option value="celsius">Celsius</option>
          <option value="fahrenheit">Fahrenheit</option>
          <option value="kelvin">Kelvin</option>
        </select>
      </div>

      <button id="btn">
        <i class="fa-solid fa-arrows-rotate"></i>
        Convert
      </button>

      <p id="error"></p>

      <h2>Converted Values</h2>

      <div class="result">
        <p id="celres">
          <i class="fa-solid fa-temperature-half temp-icon"></i>
          Celsius :
        </p>

        <p id="fahrenres">
          <i class="fa-solid fa-fire fire-icon"></i>
          Fahrenheit :
        </p>

        <p id="kelres">
          <i class="fa-solid fa-snowflake snow-icon"></i>
          Kelvin :
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
